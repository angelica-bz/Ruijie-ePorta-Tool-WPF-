name: 功能请求
description: 建议新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 清晰描述你希望添加的功能
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: 使用场景
      description: 描述这个功能会在什么情况下使用

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如果你考虑过其他替代方案，请在此描述
